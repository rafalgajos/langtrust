[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "langtrust"
version = "0.2.0"
description = "Controlled multilingual security evaluation for tool-using LLM agents"
authors = [{ name = "Rafał Gajos" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "LLM agents",
    "indirect prompt injection",
    "multilingual evaluation",
    "tool use",
    "agent security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34,<3",
    "PyYAML>=6,<7",
]


[project.urls]
Homepage = "https://github.com/rafalgajos/langtrust"
Repository = "https://github.com/rafalgajos/langtrust"
Issues = "https://github.com/rafalgajos/langtrust/issues"
DOI = "https://doi.org/10.5281/zenodo.22799188"

[project.scripts]
langtrust-benchmark = "langtrust.cli.benchmark:main"
langtrust-analyze = "langtrust.cli.analyze:main"
langtrust-gui = "langtrust.gui.app:main"
langtrust-gui-shortcut = "langtrust.cli.gui_shortcut:main"

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.11,<4",
]
dev = [
    "pytest>=9,<10",
]
all = [
    "matplotlib>=3.11,<4",
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.setuptools.package-data]
"langtrust.resources" = [
    "languages/*.yaml",
    "scenarios/*.yaml",
    "branding/*",
    "docs/*",
]
