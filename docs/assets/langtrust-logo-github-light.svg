  </g>
  </g>
  <text x="430" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="112" font-weight="700" letter-spacing="-1.5">
    <tspan fill="#F5A623">L</tspan><tspan fill="#0A0A0A">ang</tspan><tspan fill="#F5A623">T</tspan><tspan fill="#0A0A0A">rust</tspan>
  </text>
</svg>
